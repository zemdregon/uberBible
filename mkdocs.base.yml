# MkDocs Material — GitHub Pages for uberBible chapter Markdown.
# scripts/prepare-docs-dir.sh stages ./docs and writes mkdocs.yml from this base.

site_name: uberBible
site_description: Public-domain Protestant Christian Bibles (chapter Markdown)
site_url: https://zemdregon.github.io/uberBible/

repo_url: https://github.com/zemdregon/uberBible
repo_name: zemdregon/uberBible

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.expand
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow

plugins:
  - search

# Leaf chapter pages stay reachable via book/translation Contents links and search;
# only translation indexes appear in the global nav (nix-docs vault model).
validation:
  omitted_files: ignore
  absolute_links: info
  unrecognized_links: ignore
  anchors: ignore

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zemdregon/uberBible
